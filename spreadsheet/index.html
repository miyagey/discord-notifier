<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event & Ticket Board</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a 40%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --glass-panel: rgba(15, 23, 42, 0.75);
      --glass-blur: blur(16px);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-urgent: #ef4444;
      --accent-warning: #f59e0b;
      --accent-success: #10b981;
      --accent-info: #06b6d4;
      --badge-bg: rgba(255, 255, 255, 0.08);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--glass-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-create {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }
    .btn-create:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }

    .icon-btn {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .icon-btn.spinning i {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Search & Filter Bar */
    .filter-bar {
      max-width: 1400px;
      margin: 0.75rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 0.45rem 0.75rem 0.45rem 2.2rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    .brand-chips {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .brand-chips::-webkit-scrollbar {
      display: none;
    }

    .brand-chip {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--card-border);
      background: var(--badge-bg);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .brand-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1rem calc(65px + var(--safe-bottom));
    }

    /* Mode Switcher (Kanban vs Timeline) */
    .view-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
    }

    .segmented-control {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .segment-btn {
      padding: 0.35rem 0.8rem;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .segment-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .stats-badge {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Status Sub Tabs (Horizontal Scrollable Tabs) */
    .status-tabs-wrapper {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 0.5rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .status-tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .col-tab-btn {
      flex: 1;
      min-width: 78px;
      padding: 0.5rem 0.4rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .col-tab-btn .count-bubble {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }
    .col-tab-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      color: #fff;
    }
    .col-tab-btn.active .count-bubble {
      background: var(--primary);
    }

    /* Kanban Board Layout */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(280px, 1fr));
      gap: 1rem;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    @media (max-width: 960px) {
      .kanban-board {
        display: block;
      }
      .kanban-column {
        display: none !important;
      }
      .kanban-column.active-mobile-col {
        display: flex !important;
      }
    }

    @media (min-width: 961px) {
      .kanban-column {
        display: flex !important;
      }
      .hide-on-desktop-kanban {
        display: none !important;
      }
    }

    /* Column Styles */
    .kanban-column {
      background: var(--glass-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.75rem;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 250px;
      margin-bottom: 1rem;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0.4rem 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .column-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.before { background: var(--accent-info); }
    .status-dot.active { background: var(--accent-urgent); box-shadow: 0 0 8px var(--accent-urgent); }
    .status-dot.waiting { background: var(--accent-warning); }
    .status-dot.payment { background: #ec4899; box-shadow: 0 0 8px #ec4899; }
    .status-dot.finished { background: var(--text-dim); }

    .column-count {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--text-muted);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    /* Ticket Card Styles */
    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .ticket-card:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .ticket-card.urgent-active {
      border-left: 3px solid var(--accent-urgent);
    }
    .ticket-card.urgent-payment {
      border-left: 3px solid #ec4899;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .brand-tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }
    /* Brand Color Presets */
    .brand-tag[data-brand*="学マス"] { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); }
    .brand-tag[data-brand*="デレ"] { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .brand-tag[data-brand*="シャニ"] { background: rgba(6, 182, 212, 0.2); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); }
    .brand-tag[data-brand*="ミリ"] { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .brand-tag[data-brand*="SideM"] { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .brand-tag:not([data-brand*="学マス"]):not([data-brand*="デレ"]):not([data-brand*="シャニ"]):not([data-brand*="ミリ"]):not([data-brand*="SideM"]) {
      background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .deadline-countdown {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .countdown-urgent { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .countdown-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .countdown-normal { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.35rem;
      color: #fff;
    }

    .card-apply-name {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.12);
      padding: 3px 7px;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    .card-dates {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.45rem;
    }
    .date-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .card-action-bar {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-link {
      font-size: 0.74rem;
      font-weight: 600;
      color: #818cf8;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }
    .btn-link:hover {
      background: rgba(99, 102, 241, 0.3);
      color: #fff;
    }

    /* Event List View */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .event-card {
      background: var(--glass-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
    }
    .event-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .event-card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .event-status-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .event-status-tag[data-status="開催前"] { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .event-status-tag[data-status="開催期間"] { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-weight: 700; }
    .event-status-tag[data-status="開催終了"] { background: rgba(100, 116, 139, 0.2); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    .event-meta {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .event-meta-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .event-applies-box {
      margin-top: 0.4rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .event-applies-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .event-apply-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 0.25rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }
    .event-apply-row:last-child {
      border-bottom: none;
    }

    /* Timeline View */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--glass-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--card-border);
      padding: 0.5rem 1rem calc(0.5rem + var(--safe-bottom));
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 20px 20px 0 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-item i {
      width: 20px;
      height: 20px;
    }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.show {
      display: flex;
    }
    .modal-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .modal-close-btn {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Form Styles */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-label .required {
      color: var(--accent-urgent);
      margin-left: 2px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 480px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
    }
    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
    }
    .btn-secondary {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: #fff;
      padding: 0.5rem 1.25rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: calc(75px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
  </style>
</head>

  <!-- Create Type Selector Modal -->
  <div class="modal-backdrop" id="createChoiceModal">

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detailModal">

  <!-- Ticket Form Modal (Create / Edit) -->
  <div class="modal-backdrop" id="ticketFormModal">
    <div class="modal-card">
      <div class="modal-header">

        <div class="form-group">

        <div class="form-actions">

          <button type="submit" id="tfSubmitBtn" class="btn-primary">

  <!-- Event Form Modal (Create / Edit) -->
  <div class="modal-backdrop" id="eventFormModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="eventFormTitle" style="font-size: 1.05rem; font-weight: 700;">イベントの編集</h3>
        <button class="modal-close-btn" onclick="closeModal('eventFormModal')">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
      <form id="eventForm" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <input type="hidden" id="efEventId">

        <div class="form-group">
          <label class="form-label">ブランド名</label>
          <input type="text" id="efBrand" class="form-input" placeholder="例: 学マス, デレ, シャニ, ミリオン, 765 等">
        </div>

        <div class="form-group">
          <label class="form-label">イベント名 <span class="required">*</span></label>
          <input type="text" id="efName" class="form-input" placeholder="イベントの正式名称" required>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">開始日 <span class="required">*</span></label>
            <input type="date" id="efStartDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">終了日</label>
            <input type="date" id="efEndDate" class="form-input">
          </div>

        <div class="form-group">
          <label class="form-label">会場名</label>
          <input type="text" id="efLocation" class="form-input" placeholder="例: 武蔵野の森総合スポーツプラザ, Kアリーナ横浜">
        </div>

        <div class="form-group">
          <label class="form-label">イベント概要・メモ</label>
          <textarea id="efSummary" class="form-textarea" rows="3" placeholder="ツアー情報や配信情報など"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('eventFormModal')">キャンセル</button>
          <button type="submit" id="efSubmitBtn" class="btn-primary">
            <i data-lucide="save" style="width: 15px; height: 15px;"></i>
            <span>保存する</span>
          </button>

    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast" class="toast">
    <i data-lucide="check-circle" style="width: 16px; height: 16px; color: var(--accent-success);"></i>
    <span id="toastMsg">保存しました</span>
  </div>

  <script>
    // ==========================================
    // State & Initial Data
    // ==========================================
    let state = {
      events: [],
      applications: [],
      brands: [],
      selectedBrand: 'ALL',
      searchKeyword: '',
      activeNav: 'tickets', // 'tickets' | 'events'
      viewMode: 'kanban', // 'kanban' | 'timeline'
      selectedApplyStatus: '受付期間', // 'ALL' | '受付期間' | '開始前' | '当落待ち' | '入金期間' | '期間終了'
      selectedEventStatus: 'ALL', // 'ALL' | '開催前' | '開催期間' | '開催終了'
      currentDetailApp: null
    };

    // サーバーサイドから直接注入された初期データを受け取る
    try {
      const serverData = <?= (typeof initialData !== 'undefined') ? initialData : 'null' ?>;
      if (serverData && serverData.success) {
        state.events = serverData.events || [];
        state.applications = serverData.applications || [];
        state.brands = serverData.brands || [];
      }
    } catch (e) {
      console.log('Running in local/standalone preview mode');
    }

    // ==========================================
    // Lifecycle & Initialization
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupEventListeners();

      if (state.applications.length > 0 || state.events.length > 0) {
        renderApp();
      } else {
        fetchDataFromServer();
      }
    });

    function setupEventListeners() {
      // Refresh Button
      document.getElementById('refreshBtn').addEventListener('click', () => {
        const btn = document.getElementById('refreshBtn');
        btn.classList.add('spinning');
        fetchDataFromServer(() => {
          btn.classList.remove('spinning');
          showToast('データを最新化しました');
        });
      });

      // Search Input
      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.searchKeyword = e.target.value.toLowerCase().trim();
        renderApp();
      });

      // View Mode Control (Kanban vs Timeline)
      document.querySelectorAll('#viewModeControl .segment-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#viewModeControl .segment-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.viewMode = btn.dataset.mode;
          updateTabVisibility();
          renderApp();
        });
      });

      // Ticket Status Tabs
      document.querySelectorAll('#ticketStatusTabs .col-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#ticketStatusTabs .col-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.selectedApplyStatus = btn.dataset.status;
          updateMobileColumnVisibility();
          if (state.viewMode === 'timeline') {
            renderTimeline();
          }
        });
      });

      // Event Status Tabs
      document.querySelectorAll('#eventStatusTabs .col-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#eventStatusTabs .col-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.selectedEventStatus = btn.dataset.eventStatus;
          renderEvents();
        });
      });

      // Bottom Nav
      document.getElementById('navTickets').addEventListener('click', () => {
        setActiveNav('tickets');
      });
      document.getElementById('navEvents').addEventListener('click', () => {
        setActiveNav('events');
      });

      // Create Button & Choice Modal
      document.getElementById('openCreateMenuBtn').addEventListener('click', () => {
        openModal('createChoiceModal');
      });
      document.getElementById('choiceNewTicketBtn').addEventListener('click', () => {
        closeModal('createChoiceModal');
        openTicketFormModal(null);
      });
      document.getElementById('choiceNewEventBtn').addEventListener('click', () => {
        closeModal('createChoiceModal');
        openEventFormModal(null);
      });

      // Detail Modal Edit Button
      document.getElementById('modalEditBtn').addEventListener('click', () => {
        if (state.currentDetailApp) {
          closeModal('detailModal');
          openTicketFormModal(state.currentDetailApp);
        }
      });

      // Form Submits
      document.getElementById('ticketForm').addEventListener('submit', handleTicketFormSubmit);
      document.getElementById('eventForm').addEventListener('submit', handleEventFormSubmit);

      // Modal Background Clicks
      document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', (e) => {
          if (e.target === backdrop) closeModal(backdrop.id);
        });
      });
    }

    function setActiveNav(nav) {
      state.activeNav = nav;
      document.getElementById('navTickets').classList.toggle('active', nav === 'tickets');
      document.getElementById('navEvents').classList.toggle('active', nav === 'events');
      
      updateTabVisibility();
      renderApp();
    }

    function updateTabVisibility() {
      const isTickets = state.activeNav === 'tickets';
      document.getElementById('viewModeControl').style.display = isTickets ? 'inline-flex' : 'none';
      
      const ticketTabs = document.getElementById('ticketStatusTabs');
      const eventTabs = document.getElementById('eventStatusTabs');

      if (isTickets) {
        eventTabs.style.display = 'none';
        ticketTabs.style.display = 'flex';
        if (state.viewMode === 'timeline') {
          ticketTabs.classList.remove('hide-on-desktop-kanban');
        } else {
          ticketTabs.classList.add('hide-on-desktop-kanban');
        }
      } else {
        ticketTabs.style.display = 'none';
        eventTabs.style.display = 'flex';
      }
    }

    // ==========================================
    // Data Fetching & API
    // ==========================================
    function fetchDataFromServer(callback) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              state.events = res.events || [];
              state.applications = res.applications || [];
              state.brands = res.brands || [];
            }
            renderApp();
            if (callback) callback();
          })
          .withFailureHandler((err) => {
            console.error(err);
            alert('データの取得に失敗しました: ' + err.message);
            if (callback) callback();
          })
          .getAppData();
      } else {
        console.log('Using Mock Data for Local Testing');
        if (state.events.length === 0) generateMockData();
        renderApp();
        if (callback) setTimeout(callback, 500);
      }
    }

    // ==========================================
    // Form Handling (Create & Edit)
    // ==========================================
    function openTicketFormModal(app) {
      const isEdit = !!app;
      document.getElementById('ticketFormTitle').textContent = isEdit ? 'チケット申込の編集' : 'チケット申込の新規登録';
      document.getElementById('tfApplyId').value = isEdit ? app.id : '';

      // イベント選択肢の再構築
      const select = document.getElementById('tfEventId');
      select.innerHTML = '<option value="">イベントを選択してください</option>' + state.events.map(ev => {
        const label = (ev.brand ? `【${ev.brand}】` : '') + ev.name + (ev.startDate ? ` (${ev.startDate})` : '');
        return `<option value="${escapeHtml(ev.id)}">${escapeHtml(label)}</option>`;
      }).join('');

      select.value = isEdit ? (app.eventId || '') : '';
      document.getElementById('tfApplyName').value = isEdit ? (app.applyName || '') : '';
      document.getElementById('tfStartDatetime').value = isEdit ? formatDateTimeLocalInput(app.startDatetime) : '';
      document.getElementById('tfEndDatetime').value = isEdit ? formatDateTimeLocalInput(app.endDatetime) : '';
      document.getElementById('tfResultDatetime').value = isEdit ? formatDateTimeLocalInput(app.resultDatetime) : '';
      document.getElementById('tfPayEndDatetime').value = isEdit ? formatDateTimeLocalInput(app.payEndDatetime) : '';
      document.getElementById('tfMethod').value = isEdit ? (app.method || '') : '';

      openModal('ticketFormModal');
    }

    function openEventFormModal(ev) {
      const isEdit = !!ev;

    function handleTicketFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('tfSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>保存中...</span>';

      const applyId = document.getElementById('tfApplyId').value;
      const eventId = document.getElementById('tfEventId').value;
      const matchedEvent = state.events.find(ev => ev.id === eventId);

      const payload = {
        id: applyId,
        eventId: eventId,
        brand: matchedEvent ? matchedEvent.brand : '',
        eventName: matchedEvent ? matchedEvent.name : '',
        applyName: document.getElementById('tfApplyName').value.trim(),
        startDatetime: formatDateTimeDisplay(document.getElementById('tfStartDatetime').value),
        endDatetime: formatDateTimeDisplay(document.getElementById('tfEndDatetime').value),
        resultDatetime: formatDateTimeDisplay(document.getElementById('tfResultDatetime').value),
        payEndDatetime: formatDateTimeDisplay(document.getElementById('tfPayEndDatetime').value),
        method: document.getElementById('tfMethod').value.trim()
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        const handler = (res) => {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="save" style="width: 15px; height: 15px;"></i><span>保存する</span>';
          if (res && res.success) {
            closeModal('ticketFormModal');
            showToast(applyId ? 'チケット申込を更新しました' : 'チケット申込を登録しました');
            fetchDataFromServer();
          } else {
            alert('保存に失敗しました: ' + (res ? res.error : '不明なエラー'));
          }
        };

        if (applyId) {
          google.script.run.withSuccessHandler(handler).withFailureHandler(err => {
            btn.disabled = false;
            alert(err.message);
          }).updateApplication(payload);
        } else {
          google.script.run.withSuccessHandler(handler).withFailureHandler(err => {
            btn.disabled = false;
            alert(err.message);
          }).createApplication(payload);
        }
      } else {
        // Mock fallback
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="save" style="width: 15px; height: 15px;"></i><span>保存する</span>';
          if (applyId) {
            const idx = state.applications.findIndex(a => a.id === applyId);
            if (idx !== -1) {
              state.applications[idx] = { ...state.applications[idx], ...payload };
            }
          } else {
            payload.id = 'AP-' + String(state.applications.length + 1).padStart(3, '0');
            payload.status = '受付期間';
            state.applications.unshift(payload);
          }
          closeModal('ticketFormModal');
          showToast(applyId ? 'チケット申込を更新しました (モック)' : 'チケット申込を登録しました (モック)');
          renderApp();
        }, 400);
      }
    }

    function renderApp() {

        if (state.viewMode === 'kanban') {
          document.getElementById('kanbanContainer').style.display = 'grid';

        } else {

    function renderBrandChips() {
      const container = document.getElementById('brandChips');
      const allBrands = ['ALL', ...state.brands];

      container.innerHTML = allBrands.map(b => {
        const isActive = state.selectedBrand === b;
        const label = b === 'ALL' ? 'すべて' : b;
        return `<button class="brand-chip ${isActive ? 'active' : ''}" data-brand="${escapeHtml(b)}">${escapeHtml(label)}</button>`;
      }).join('');

      container.querySelectorAll('.brand-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          state.selectedBrand = chip.dataset.brand;
          renderApp();
        });
      });

    function filterItems(items) {
      return items.filter(item => {
        if (state.selectedBrand !== 'ALL' && item.brand !== state.selectedBrand) {
          return false;
        }
        if (state.searchKeyword) {
          const matchTarget = `${item.eventName || item.name || ''} ${item.brand || ''} ${item.applyName || ''} ${item.location || ''}`.toLowerCase();
          if (!matchTarget.includes(state.searchKeyword)) {
            return false;
          }
        }
        return true;
      });
    }

      Object.values(columns).forEach(col => col.innerHTML = '');

        counts[colKey]++;

    function formatDateTimeLocalInput(dateStr) {
      if (!dateStr) return '';
      // "2026-09-28 23:59" -> "2026-09-28T23:59"
      return dateStr.replace(' ', 'T');
    }

    function formatDateTimeDisplay(inputVal) {
      if (!inputVal) return '';
      // "2026-09-28T23:59" -> "2026-09-28 23:59"
      return inputVal.replace('T', ' ');
    }

    function calculateCountdown(app) {
      const now = new Date();
      let targetDateStr = app.endDatetime;
      let isPayment = false;

      if (app.status === '入金期間' && app.payEndDatetime) {
        targetDateStr = app.payEndDatetime;
        isPayment = true;
      }

      if (!targetDateStr) return null;

      const targetDate = new Date(targetDateStr.replace(/-/g, '/'));
      if (isNaN(targetDate.getTime())) return null;

      const diffMs = targetDate.getTime() - now.getTime();
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffDays = Math.floor(diffHours / 24);

      if (diffMs <= 0) {
        return { text: '締切済', style: 'countdown-normal' };
      }

      if (diffHours < 24) {
        return {
          text: `あと ${diffHours}時間`,
          style: 'countdown-urgent'
        };
      } else if (diffDays <= 3) {
        return {
          text: `あと ${diffDays}日`,
          style: 'countdown-warn'
        };
      } else {
        return {
          text: `あと ${diffDays}日`,
          style: 'countdown-normal'
        };
      }
    }

    function getDeadlineStyle(dateStr) {
      if (!dateStr) return 'countdown-normal';
      const target = new Date(dateStr.replace(/-/g, '/'));
      if (isNaN(target.getTime())) return 'countdown-normal';
      const diffMs = target.getTime() - new Date().getTime();
      if (diffMs < 0) return 'countdown-normal';
      if (diffMs < 24 * 60 * 60 * 1000) return 'countdown-urgent';
      if (diffMs < 3 * 24 * 60 * 60 * 1000) return 'countdown-warn';
      return 'countdown-normal';
    }

    function extractUrl(text) {
      if (!text) return null;
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const match = text.match(urlRegex);
      return match ? match[0] : null;
    }

    function formatMethodText(text) {
      if (!text) return '';
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return escapeHtml(text).replace(urlRegex, (url) => {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: #818cf8; text-decoration: underline;">${url}</a>`;
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
